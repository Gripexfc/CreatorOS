[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creatoros"
version = "0.1.0"
description = "A local-first content operating system for individual creators"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "pydantic>=2.7,<3",
    "sqlalchemy>=2.0,<3",
    "uvicorn>=0.30,<1",
    "sse-starlette>=2.1,<4",
    "python-multipart>=0.0.9,<1",
    "httpx>=0.27,<1",
    "PyYAML>=6,<7",
    "requests>=2.32,<3",
    "websocket-client>=1.7,<2",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]
wechat = [
    "playwright>=1.44,<2",
]

[project.scripts]
creatoros = "creatoros.cli:main"

[tool.setuptools.packages.find]
include = ["creatoros*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
